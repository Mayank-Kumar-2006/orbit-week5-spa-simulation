<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A polished single-page application simulation built with HTML, CSS and vanilla JavaScript.">
  <title>Orbit — SPA Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/" data-route="/" aria-label="Orbit dashboard home">
        <span class="brand-mark" aria-hidden="true">O</span>
        <span>Orbit</span>
      </a>

      <nav class="nav" aria-label="Primary navigation">
        <a href="#/" data-route="/">Overview</a>
        <a href="#/projects" data-route="/projects">Projects</a>
        <a href="#/activity" data-route="/activity">Activity</a>
        <a href="#/settings" data-route="/settings">Settings</a>
      </nav>

      <button class="avatar-button" id="profileButton" type="button" aria-label="Open profile menu">MG</button>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Orbit SPA Simulation</span>
      <span>HTML · CSS · Vanilla JavaScript</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="profile-dialog" id="profileDialog" aria-labelledby="profileTitle">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">Account</p>
        <h2 id="profileTitle">Profile</h2>
      </div>
      <button class="icon-button" id="closeProfile" type="button" aria-label="Close profile">×</button>
    </div>
    <div class="profile-row">
      <div class="avatar-large">MG</div>
      <div>
        <strong>Mayank</strong>
        <span>Frontend Developer</span>
      </div>
    </div>
    <button class="button button-primary full" id="profileDone" type="button">Done</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
